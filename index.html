body {
    background: #f3f3f3;
}

#ficha {
    width: 100%;
    background: #fff;
}

.ficha-cabecera,
.tabla-pendientes {
    border-color: #000;
    color: #000;
}

.ficha-cabecera th,
.ficha-cabecera td,
.tabla-pendientes th,
.tabla-pendientes td {
    border: 1px solid #000 !important;
}

.ficha-cabecera .label-cell {
    width: 120px;
    background-color: #ffeb3b !important;
    font-size: clamp(1.1rem, 3vw, 2rem);
    font-weight: 700;
    text-align: center;
    vertical-align: middle;
}

.ficha-cabecera .label-cell label {
    margin: 0;
}

.celda-cabecera {
    text-align: center;
    vertical-align: middle;
}

.ficha-input {
    min-height: 3rem;
    border: 0;
    border-radius: 0;
    color: #000;
    text-align: center;
}

.ficha-input:focus {
    box-shadow: inset 0 0 0 2px #0d6efd;
}

.fecha-contenedor {
    position: relative;
    min-height: 3rem;
}

.fecha-display {
    height: 100%;
}

.fecha-picker {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

.fecha-contenedor:focus-within .fecha-display {
    box-shadow: inset 0 0 0 2px #0d6efd;
}

.titulo {
    padding: 0.5rem;
    background: #79c753;
    color: #000;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 700;
    text-align: center;
}

.tabla-pendientes {
    table-layout: fixed;
}

.tabla-pendientes thead th {
    background-color: #ffeb3b !important;
    font-weight: 700;
    text-align: center;
}

.tabla-pendientes .col-numero,
.tabla-pendientes .numero {
    width: 90px;
    text-align: center;
}

.tabla-pendientes .col-completado,
.tabla-pendientes .celda-checkbox {
    width: 120px;

.tabla-pendientes .descripcion,
.tabla-pendientes .celda-checkbox {

.tabla-pendientes .descripcion {
    overflow-wrap: anywhere;
    white-space: pre-wrap;

.tabla-pendientes .descripcion:focus {
    outline: 2px solid #0d6efd;

    width: 1.15rem;
    height: 1.15rem;

                    </table>
                </div>
            </section>

            <aside class="col-12 col-lg-3 d-flex flex-column gap-2" aria-label="Acciones">
                <button type="button" class="btn btn-primary py-3" id="capturarFicha">
                    Capturar ficha
                </button>
                <button type="button" class="btn btn-success py-3" id="enviarWhatsApp">
                    Copiar captura y abrir grupo
                </button>
                <small class="text-muted">
                    La captura se copia y descarga. En WhatsApp, haz clic en el chat, presiona Ctrl+V y luego Enviar.
                </small>
                <button type="button" class="btn btn-secondary py-3" id="abrirModalPendiente">
                    INSERTAR N°
                </button>
                <button type="button" class="btn btn-outline-secondary py-3" id="limpiarFicha">
                    LIMPIAR
                </button>
            </aside>
        </div>
    </main>

    <div class="modal fade" id="modalPendiente" tabindex="-1" aria-labelledby="modalPendienteLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="formPendiente">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="modalPendienteLabel">Nuevo pendiente</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <label for="descripcionNueva" class="form-label">Descripción</label>
                        <textarea
                            id="descripcionNueva"
                            class="form-control"
                            rows="3"
                            required></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Agregar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    const siteInput = document.getElementById("site");
    const tbody = document.querySelector("#tablaPendientes tbody");
    const modalElement = document.getElementById("modalPendiente");
    const modalPendiente = new bootstrap.Modal(modalElement);
    const formulario = document.getElementById("formPendiente");
    const descripcionNueva = document.getElementById("descripcionNueva");
    const mensajeError = document.getElementById("mensajeError");
    const textoError = document.getElementById("textoError");
    const botonCapturar = document.getElementById("capturarFicha");
    const botonWhatsApp = document.getElementById("enviarWhatsApp");

    const fechaLocal = () => {
        const hoy = new Date();
        const mes = String(hoy.getMonth() + 1).padStart(2, "0");
        const dia = String(hoy.getDate()).padStart(2, "0");
        return `${hoy.getFullYear()}-${mes}-${dia}`;
    };

    const actualizarFechaVisible = () => {
        const partes = fechaInput.value.split("-");
        fechaVisible.value = partes.length === 3
            ? `${partes[2]}-${partes[1]}-${partes[0]}`
            : "";
    };

    const mostrarError = (mensaje) => {
        textoError.textContent = mensaje;
        mensajeError.classList.remove("d-none");
    };

    const ocultarError = () => {
        mensajeError.classList.add("d-none");
    };

    const siguienteNumero = () => {
        const numeros = Array.from(tbody.querySelectorAll(".numero"))
            .map((celda) => Number.parseInt(celda.textContent, 10))
            .filter((numero) => Number.isInteger(numero) && numero > 0);
        return Math.max(0, ...numeros) + 1;
    };

    const crearFila = (numero, descripcion) => {
        const fila = document.createElement("tr");
        const celdaNumero = document.createElement("td");
        const celdaDescripcion = document.createElement("td");
        const celdaCheckbox = document.createElement("td");
        const checkbox = document.createElement("input");

        celdaNumero.className = "numero";
        celdaNumero.textContent = String(numero);

        celdaDescripcion.className = "descripcion";
        celdaDescripcion.contentEditable = "true";
        celdaDescripcion.setAttribute("role", "textbox");
        celdaDescripcion.setAttribute("aria-label", `Descripción del pendiente ${numero}`);
        celdaDescripcion.spellcheck = true;
        celdaDescripcion.textContent = descripcion;

        celdaCheckbox.className = "celda-checkbox";
        checkbox.type = "checkbox";
        checkbox.setAttribute("aria-label", `Pendiente ${numero} completado`);
        celdaCheckbox.appendChild(checkbox);

        fila.append(celdaNumero, celdaDescripcion, celdaCheckbox);
        return fila;
    };

    const nombreArchivo = () => {
        const ahora = new Date();
        const fecha = fechaLocal();
        const hora = [
            String(ahora.getHours()).padStart(2, "0"),
            String(ahora.getMinutes()).padStart(2, "0"),
            String(ahora.getSeconds()).padStart(2, "0")
        ].join("");
        return `FichaPendientes_${fecha}_${hora}.png`;
    };

    fechaInput.value = fechaLocal();
    actualizarFechaVisible();
    fechaInput.addEventListener("input", actualizarFechaVisible);
    fechaInput.addEventListener("change", actualizarFechaVisible);

    document.getElementById("abrirModalPendiente").addEventListener("click", () => {
        ocultarError();
        formulario.reset();
        modalPendiente.show();
        modalElement.addEventListener("shown.bs.modal", () => descripcionNueva.focus(), { once: true });
    });

    formulario.addEventListener("submit", (evento) => {
        evento.preventDefault();
        const descripcion = descripcionNueva.value.trim();
        if (!descripcion) {
            descripcionNueva.focus();
            return;
        }

        tbody.appendChild(crearFila(siguienteNumero(), descripcion));
        modalPendiente.hide();
        formulario.reset();
    });

    document.getElementById("limpiarFicha").addEventListener("click", () => {
        while (tbody.rows.length > 1) {
            tbody.deleteRow(1);
        }

        const primeraFila = tbody.rows[0];
        primeraFila.querySelector(".descripcion").textContent = "";
        primeraFila.querySelector('input[type="checkbox"]').checked = false;
        siteInput.value = "";
        fechaInput.value = fechaLocal();
        actualizarFechaVisible();
        ocultarError();
    });

    document.getElementById("cerrarError").addEventListener("click", ocultarError);

    const crearCaptura = async () => {
        try {
            if (typeof window.html2canvas !== "function") {
                throw new Error("No se pudo cargar html2canvas. Verifica tu conexión a Internet y vuelve a intentarlo.");
            }

            const canvas = await window.html2canvas(document.getElementById("ficha"), {
                backgroundColor: "#ffffff",
                scale: window.devicePixelRatio || 1
            });

            const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
            if (!blob) {
                throw new Error("No se pudo generar la imagen PNG.");
            }

            return blob;
        } catch (error) {
            mostrarError(error instanceof Error ? error.message : "Ocurrió un error al capturar la ficha.");
            return null;
        }
    };

    const descargarCaptura = (blob) => {
        try {
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement("a");
            enlace.href = url;
            enlace.download = nombreArchivo();
            document.body.appendChild(enlace);
            enlace.click();
            enlace.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (error) {
            mostrarError(error instanceof Error
                ? `No se pudo descargar la captura: ${error.message}`
                : "No se pudo descargar la captura.");
        }
    };

    botonCapturar.addEventListener("click", async () => {
        ocultarError();
        botonCapturar.disabled = true;

        try {
            const blob = await crearCaptura();
            if (blob) {
                descargarCaptura(blob);
            }
        } finally {
            botonCapturar.disabled = false;
        }
    });

    botonWhatsApp.addEventListener("click", async () => {
        ocultarError();
        botonWhatsApp.disabled = true;

        try {
            const blob = await crearCaptura();
            if (!blob) {
                return;
            }

            try {
                if (!navigator.clipboard || typeof ClipboardItem === "undefined") {
                    throw new Error("Tu navegador no permite copiar imágenes al portapapeles desde esta página.");
                }

                await navigator.clipboard.write([
                    new ClipboardItem({ "image/png": blob })
                ]);
            } catch (error) {
                mostrarError(error instanceof Error
                    ? `${error.message} La captura se descargará; puedes adjuntarla manualmente en WhatsApp.`
                    : "No se pudo copiar la imagen. La captura se descargará para que puedas adjuntarla manualmente.");
                descargarCaptura(blob);
                return;
            }

            descargarCaptura(blob);
            window.location.href = "https://chat.whatsapp.com/C6tOSBctlnQ2A403MvGzcb";
        } finally {
            botonWhatsApp.disabled = false;
        }
    });
});

</script>
</body>
</html>
